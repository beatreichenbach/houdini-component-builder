[project]
name = "houdini-component-builder"
version = "0.1.0"
description = "Build Solaris Component Builder networks in SideFX Houdini"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

[project.urls]
Repository = "https://github.com/beatreichenbach/houdini-component-builder"

[project.optional-dependencies]
dev = [
    "python-semantic-release>=10.0",
    "ruff>=0.16",
    "types-houdini>=21.0",
    "types-usd>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["component_builder*"]

[tool.semantic_release]
version_variables = ["component_builder/__init__.py:__version__"]
version_toml  = ["pyproject.toml:project.version"]

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
